name: image

# Builds the gateway image, proves it serves (scripts/smoke-gateway.sh), and only then publishes
# it to GitHub Container Registry with provenance and an SBOM.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "src/**", "scripts/smoke-gateway.sh", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/genkai-gateway

jobs:
  gateway:
    name: build, smoke test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: genkai-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: scripts/smoke-gateway.sh genkai-gateway:test

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
