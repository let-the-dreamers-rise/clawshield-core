name: codeql

# Static security analysis of the TypeScript (gateway, verifier, MCP server, site) and of these
# workflows themselves. Findings land in the repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Tests feed the code hostile input on purpose, and fake keys to prove they are refused.
          config: |
            paths-ignore:
              - test
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
