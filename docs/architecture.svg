<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
<title id="t">GENKAI architecture</title>
<desc id="d">An AI agent asks the GENKAI gateway for a transfer. The gateway sends the request and its ledger state to the policy provider, an Arcium MXE evaluating the encrypted policy, which records its verdict on Solana. The gateway signs a transfer only on allow, and writes a signed receipt for every verdict. Anyone can verify the receipts against the records on chain.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.title{font-size:16px;font-weight:700;fill:#18181c}.line{font-size:13px;fill:#5d5d67}.label{font-size:12px;font-weight:600;fill:#11703f}.arrow{fill:none;stroke:#5d5d67;stroke-width:1.5}</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d5d67"/></marker></defs>
<rect x="20" y="40" width="210" height="120" rx="12" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.25"/><text x="36" y="69" class="title">AI agent</text><text x="36" y="94" class="line">MCP: request_transfer</text><text x="36" y="113" class="line">or HTTP, with an agent key</text><text x="36" y="132" class="line">never holds a signing key</text>
<rect x="310" y="20" width="300" height="170" rx="12" fill="#eeedfc" stroke="#3730a3" stroke-width="2"/><text x="326" y="49" class="title" fill="#3730a3">GENKAI gateway</text><text x="326" y="74" class="line">API keys, roles, rate limits</text><text x="326" y="93" class="line">SQLite ledger: spend, window, calls</text><text x="326" y="112" class="line">per-agent queue, idempotency keys</text><text x="326" y="131" class="line">vault key: signs only on allow</text>
<rect x="710" y="20" width="270" height="170" rx="12" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.25"/><text x="726" y="49" class="title">Policy provider</text><text x="726" y="74" class="line">sealed: an Arcium MXE evaluates</text><text x="726" y="93" class="line">the encrypted policy (cluster 456)</text><text x="726" y="112" class="line"></text><text x="726" y="131" class="line">plaintext: the same rules,</text><text x="726" y="150" class="line">replayable by anyone</text>
<rect x="310" y="280" width="300" height="120" rx="12" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.25"/><text x="326" y="309" class="title">Signed receipt chain</text><text x="326" y="334" class="line">every verdict: commitment, request,</text><text x="326" y="353" class="line">state, rules, DecisionRecord,</text><text x="326" y="372" class="line">transaction, previous receipt's hash</text>
<rect x="710" y="280" width="270" height="120" rx="12" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.25"/><text x="726" y="309" class="title">Solana</text><text x="726" y="334" class="line">GENKAI program: PolicyRecord,</text><text x="726" y="353" class="line">one DecisionRecord per verdict</text><text x="726" y="372" class="line">transfers, receipt id in the memo</text>
<rect x="20" y="280" width="210" height="120" rx="12" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.25"/><text x="36" y="309" class="title">Anyone verifies</text><text x="36" y="334" class="line">browser, CLI or hosted API</text><text x="36" y="353" class="line">against public values only;</text><text x="36" y="372" class="line">the policy is never revealed</text>
<path d="M230 100 H302" class="arrow" marker-end="url(#head)"/><text x="266" y="92" class="label" text-anchor="middle">asks</text>
<path d="M610 75 H702" class="arrow" marker-end="url(#head)"/><text x="660" y="58" class="label" text-anchor="middle">request,</text><text x="660" y="73" class="label" text-anchor="middle">ledger state</text>
<path d="M710 140 H618" class="arrow" marker-end="url(#head)"/><text x="660" y="158" class="label" text-anchor="middle">verdict</text>
<path d="M845 190 V272" class="arrow" marker-end="url(#head)"/><text x="853" y="236" class="label" text-anchor="start">records</text>
<path d="M460 190 V272" class="arrow" marker-end="url(#head)"/><text x="468" y="236" class="label" text-anchor="start">every verdict</text>
<path d="M592 190 L716 278" class="arrow" marker-end="url(#head)"/><text x="682" y="226" class="label" text-anchor="start">allow only:</text><text x="682" y="241" class="label" text-anchor="start">signed transfer</text>
<path d="M310 340 H238" class="arrow" marker-end="url(#head)"/><text x="274" y="332" class="label" text-anchor="middle">receipts</text>
<path d="M845 400 V440 H125 V408" class="arrow" marker-end="url(#head)"/><text x="485" y="432" class="label" text-anchor="middle">reads the records and transfers on chain</text>
</svg>
